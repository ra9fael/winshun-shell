<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" font-family="Segoe UI, Microsoft YaHei UI, sans-serif">
  <rect width="1000" height="830" fill="#101114"/>

  <!-- ============ title ============ -->
  <text x="40" y="44" font-size="17" font-weight="600" fill="#e8eaed">ra9fael.shell · 管理员终端窗口模型 — 线框（0.2.0）</text>
  <text x="40" y="66" font-size="12" fill="#8b8f98">深色主题示意，非像素稿。蓝色实心与虚线框 = 0.2.0 新增；其余为 0.1.0 现状。结果不返回 Win顺：管理员命令的输出只存在于窗口里。</text>

  <!-- ============ Panel A · command page ============ -->
  <text x="40" y="92" font-size="13" fill="#8b8f98">A · 命令页（输入 `&gt; net stop w32time`）— 一条命令三行</text>
  <rect x="40" y="100" width="440" height="346" rx="12" fill="#202126" stroke="#34363d"/>
  <rect x="52" y="112" width="416" height="32" rx="8" fill="#2a2c33" stroke="#3a3d45"/>
  <text x="62" y="133" font-family="Cascadia Mono, Consolas, monospace" font-size="13">
    <tspan fill="#8b8f98">&gt; </tspan><tspan fill="#e8eaed">net stop w32time</tspan>
  </text>
  <line x1="212" y1="118" x2="212" y2="136" stroke="#cfd3da" stroke-width="1.4"/>

  <rect x="48" y="156" width="424" height="42" rx="8" fill="#2f3138"/>
  <text x="62" y="174" font-size="14" fill="#e8eaed">执行：net stop w32time</text>
  <text x="62" y="191" font-size="11.5" fill="#9aa0a6">PowerShell 7 · C:\Users\renfei</text>
  <text x="462" y="182" font-size="10.5" fill="#8b8f98" text-anchor="end">Enter · Ctrl+Shift+Enter · Ctrl+Enter · Shift+Enter</text>

  <rect x="48" y="204" width="424" height="42" rx="8" fill="#232733" stroke="#4f8cff" stroke-dasharray="5 3"/>
  <text x="62" y="222" font-size="14" fill="#e8eaed">以管理员执行：net stop w32time</text>
  <text x="62" y="239" font-size="11.5" fill="#79a8ff">UAC 确认 · 终端窗口 · PowerShell 7</text>
  <text x="462" y="230" font-size="10.5" fill="#79a8ff" text-anchor="end">Enter</text>

  <rect x="48" y="252" width="424" height="42" rx="8" fill="#232733" stroke="#4f8cff" stroke-dasharray="5 3"/>
  <text x="62" y="270" font-size="14" fill="#e8eaed">在终端执行：net stop w32time</text>
  <text x="62" y="287" font-size="11.5" fill="#79a8ff">终端窗口 · 窗口留存 · PowerShell 7</text>
  <text x="462" y="278" font-size="10.5" fill="#79a8ff" text-anchor="end">Enter</text>

  <rect x="48" y="300" width="424" height="42" rx="8" fill="#282a30"/>
  <text x="62" y="318" font-size="13.5" fill="#cfd3da">net stop w32time</text>
  <text x="62" y="335" font-size="11.5" fill="#9aa0a6">PowerShell 7 · 用过 3 次</text>
  <text x="462" y="326" font-size="10.5" fill="#8b8f98" text-anchor="end">Enter · Ctrl+Shift+Enter</text>

  <text x="62" y="376" font-size="11.5" fill="#9aa0a6">危险规则命中时，红色提示行插在运行行之前（确认后再执行）。</text>
  <text x="62" y="396" font-size="11.5" fill="#9aa0a6">`adminMode=off`：管理员行消失；终端行与管理员设置无关，各 shell 都有。</text>
  <text x="62" y="416" font-size="11.5" fill="#9aa0a6">bash / MSYS2 / WSL：没有管理员行，只有运行行 + 终端行。</text>

  <!-- ============ Panel B · elevated window ============ -->
  <text x="520" y="92" font-size="13" fill="#8b8f98">B · 管理员窗口（UAC 同意后；二段式落进 Windows Terminal）</text>
  <rect x="520" y="100" width="440" height="346" rx="12" fill="#202126" stroke="#34363d"/>

  <!-- flash annotation -->
  <rect x="544" y="128" width="86" height="40" rx="6" fill="#0a0b0d" stroke="#4a4d55" stroke-dasharray="4 3"/>
  <text x="587" y="152" font-size="10.5" fill="#8b8f98" text-anchor="middle">黑框·闪一下</text>
  <path d="M634 148 h30" stroke="#8b8f98" stroke-width="1.2" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#8b8f98"/>
    </marker>
  </defs>

  <!-- WT window mock -->
  <rect x="672" y="122" width="264" height="284" rx="8" fill="#1b1d22" stroke="#3a3d45"/>
  <rect x="672" y="122" width="264" height="26" rx="8" fill="#23252b"/>
  <rect x="682" y="127" width="120" height="16" rx="4" fill="#2f3138"/>
  <text x="690" y="139" font-size="10" fill="#cfd3da">命令提示符 · 管理员</text>
  <circle cx="922" cy="135" r="4" fill="#4a4d55"/>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="10.5">
    <text x="684" y="170" fill="#9aa0a6">Microsoft Windows [Version 10.0.26300.9818]</text>
    <text x="684" y="188" fill="#9aa0a6">(c) Microsoft Corporation。保留所有权利。</text>
    <text x="684" y="214" fill="#e8eaed">C:\Windows\system32&gt;whoami /groups</text>
    <text x="684" y="238" fill="#9aa0a6">…  WhoAmI 输出 …</text>
    <text x="684" y="262" fill="#79a8ff">S-1-16-12288 High Mandatory Level</text>
    <text x="684" y="288" fill="#e8eaed">C:\Windows\system32&gt;_</text>
    <text x="684" y="318" fill="#8b8f98">（跑完留在提示符，用户自己关窗口；</text>
    <text x="684" y="336" fill="#8b8f98">pwsh 用 -NoExit 留在会话，可接着敲）</text>
    <text x="684" y="366" fill="#8b8f98">交互式命令直接操作：pause、安装器</text>
    <text x="684" y="384" fill="#8b8f98">向导都在这个窗口里走完。</text>
  </g>

  <text x="544" y="428" font-size="11.5" fill="#9aa0a6">二段式：同意对象仍是 System32 cmd.exe（/c）→ 它在提权会话里拉起 wt.exe 后即退。</text>

  <!-- ============ Panel C · normal result page ============ -->
  <text x="40" y="482" font-size="13" fill="#8b8f98">C · 普通运行的结果页（对照）— 管理员命令没有这一页</text>
  <rect x="40" y="490" width="920" height="300" rx="12" fill="#202126" stroke="#34363d"/>
  <rect x="52" y="502" width="896" height="32" rx="8" fill="#2a2c33" stroke="#3a3d45"/>
  <text x="62" y="523" font-family="Cascadia Mono, Consolas, monospace" font-size="13">
    <tspan fill="#8b8f98">&gt; </tspan><tspan fill="#e8eaed">#r4212345600</tspan>
  </text>

  <rect x="48" y="546" width="896" height="42" rx="8" fill="#2f3138"/>
  <text x="62" y="564" font-size="14" fill="#e8eaed">退出码 0 · 1.2 秒</text>
  <text x="62" y="581" font-size="11.5" fill="#9aa0a6">PowerShell 7 · net stop w32time</text>
  <text x="934" y="572" font-size="10.5" fill="#8b8f98" text-anchor="end">运行中 Enter 取消 · 结束后 Enter 再执行 · Ctrl+Shift+Enter 管理员再执行</text>

  <rect x="48" y="594" width="896" height="34" rx="8" fill="#282a30"/>
  <text x="62" y="616" font-size="13" fill="#cfd3da">复制全部输出</text>
  <text x="934" y="616" font-size="10.5" fill="#8b8f98" text-anchor="end">Enter</text>
  <rect x="48" y="632" width="896" height="34" rx="8" fill="#282a30"/>
  <text x="62" y="654" font-size="13" fill="#cfd3da">在编辑器里打开日志</text>
  <rect x="48" y="670" width="896" height="34" rx="8" fill="#282a30"/>
  <text x="62" y="692" font-size="13" fill="#cfd3da">在终端里重新执行</text>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="11.5">
    <text x="62" y="726" fill="#9aa0a6">服务正在停止…</text>
    <text x="62" y="746" fill="#9aa0a6">服务已经停止成功。</text>
    <text x="62" y="766" fill="#79a8ff">… [line truncated; full output in the log]</text>
  </g>
  <text x="934" y="766" font-size="10.5" fill="#8b8f98" text-anchor="end">单行 &gt; 4 KB 截断，日志保整行；Enter 打开日志</text>

  <text x="40" y="816" font-size="12" fill="#8b8f98">细节与失败矩阵见 shell-admin-design.md；旧模型（后台提权 + 结果页）线框见 shell-admin-wireframe.svg（留档）。</text>
</svg>
